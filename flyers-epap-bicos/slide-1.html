<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: "Manrope"; font-weight: 400; font-display: block;
        src: url("assets/fonts/manrope-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 500; font-display: block;
        src: url("assets/fonts/manrope-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 600; font-display: block;
        src: url("assets/fonts/manrope-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 700; font-display: block;
        src: url("assets/fonts/manrope-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Manrope"; font-weight: 800; font-display: block;
        src: url("assets/fonts/manrope-latin-800-normal.woff2") format("woff2"); }

      :root {
        --azul-escuro: #0E2350;
        --azul: #1F4BA8;
        --azul-claro: #E8EFFB;
        --papel: #FBFAF9;
        --bege: #E7DCCB;
        --texto: #46536C;
        --linha: #DCE3EF;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1350px; overflow: hidden;
        background: var(--papel);
        font-family: "Manrope", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .folha { position: relative; width: 1080px; height: 1350px; padding: 76px 78px 0; }

      /* faixa bege fina no topo, a servir de assinatura de marca */
      .fita { position: absolute; top: 0; left: 0; width: 1080px; height: 10px;
        background: linear-gradient(90deg, var(--azul-escuro) 0%, var(--azul) 46%, var(--bege) 100%); }

      /* ---------- cabeçalho ---------- */
      .topo { display: flex; align-items: flex-start; justify-content: space-between; }
      .logo { width: 208px; display: block; }
      .etiquetas { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; padding-top: 6px; }
      .etq { font-size: 17px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; }
      .etq-1 { color: var(--azul); }
      .etq-2 { color: var(--texto); background: var(--azul-claro);
        padding: 9px 18px; border-radius: 4px; letter-spacing: .2em; font-size: 15px; }

      .risco { height: 1px; background: var(--linha); margin: 46px 0 0; }

      /* ---------- título ---------- */
      .titulo { margin-top: 52px; }
      .t-leve { font-size: 46px; font-weight: 500; line-height: 1.24; letter-spacing: -.012em;
        color: var(--texto); }
      .t-forte { font-size: 74px; font-weight: 800; line-height: 1.06; letter-spacing: -.032em;
        color: var(--azul-escuro); margin-top: 12px; }

      .local { display: flex; align-items: center; gap: 16px; margin-top: 36px; }
      .local .traco { width: 46px; height: 3px; background: var(--bege); }
      .local span { font-size: 25px; font-weight: 600; color: var(--azul); letter-spacing: .01em; }

      /* ---------- imagem clínica ---------- */
      .imagem { position: absolute; left: 78px; top: 660px; width: 924px; height: 452px;
        border-radius: 6px; overflow: hidden; background: var(--azul-claro);
        box-shadow: 0 18px 44px rgba(14,35,80,.10); }
      .imagem img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .imagem .vazio { width: 100%; height: 100%; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 10px;
        border: 1px dashed #9DB2D8; }
      .imagem .vazio b { font-size: 20px; font-weight: 700; letter-spacing: .22em;
        text-transform: uppercase; color: #7C93BE; }
      .imagem .vazio i { font-size: 16px; font-style: normal; color: #93A7CD; }

      /* ---------- formadora ---------- */
      .formadora { position: absolute; left: 78px; top: 1160px; width: 924px;
        display: flex; align-items: center; gap: 26px;
        border-top: 1px solid var(--linha); padding-top: 26px; }
      .retrato { width: 104px; height: 104px; border-radius: 6px; flex: none;
        overflow: hidden; background: var(--azul-claro); }
      .retrato img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .retrato .vazio { width: 100%; height: 100%; display: flex; align-items: center;
        justify-content: center; border: 1px dashed #9DB2D8; font-size: 12px;
        font-weight: 700; letter-spacing: .12em; color: #7C93BE; text-align: center;
        line-height: 1.3; padding: 6px; }
      .f-txt { display: flex; flex-direction: column; }
      .f-rot { font-size: 15px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase;
        color: var(--azul); }
      .f-nome { font-size: 36px; font-weight: 800; letter-spacing: -.02em;
        color: var(--azul-escuro); margin-top: 7px; }
      .f-papel { font-size: 21px; font-weight: 500; color: var(--texto); margin-top: 4px; }
    </style>
  </head>
  <body>
    <div class="folha">
      <div class="fita"></div>

      <div class="topo">
        <img class="logo" src="assets/logo-epap-azul.png" alt="EPAP" />
        <div class="etiquetas">
          <span class="etq etq-1">Formação</span>
          <span class="etq etq-2">Online + Presencial</span>
        </div>
      </div>

      <div class="risco"></div>

      <div class="titulo">
        <div class="t-leve">Bicos artificiais na abordagem<br />clínica da</div>
        <div class="t-forte">disfunção oral<br />no lactente</div>
      </div>

      <div class="local">
        <span class="traco"></span>
        <span>Lisboa · novembro de 2026</span>
      </div>

      <div class="imagem">
        <div class="vazio">
          <b>Imagem clínica</b>
          <i>a gerar</i>
        </div>
      </div>

      <div class="formadora">
        <div class="retrato">
          <div class="vazio">RETRATO<br />EM FALTA</div>
        </div>
        <div class="f-txt">
          <span class="f-rot">Formadora</span>
          <span class="f-nome">Joana Caçoeiro</span>
          <span class="f-papel">Terapeuta da Fala</span>
        </div>
      </div>
    </div>
  </body>
</html>
