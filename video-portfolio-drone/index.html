<!doctype html>
<html lang="pt-PT" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: block;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 500; font-style: normal; font-display: block;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: block;
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; font-style: normal; font-display: block;
        src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; font-style: normal; font-display: block;
        src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 900; font-style: normal; font-display: block;
        src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2"); }

      :root {
        --ink: #ffffff;
        --muted: rgba(255,255,255,.76);
        --acento: #F2C14E;         /* âmbar — troque pela cor da sua marca */
        --preto: #06070A;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: var(--preto);
      }
      body {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      /* ---------- planos ---------- */
      .plano { width: 1920px; height: 1080px; object-fit: cover; }

      #veu {
        background:
          linear-gradient(180deg, rgba(6,7,10,.72) 0%, rgba(6,7,10,.10) 24%,
            rgba(6,7,10,0) 44%, rgba(6,7,10,0) 58%, rgba(6,7,10,.44) 80%, rgba(6,7,10,.90) 100%);
      }
      #vinheta {
        background: radial-gradient(112% 78% at 50% 48%, rgba(6,7,10,0) 42%, rgba(6,7,10,.66) 100%);
      }
      #grao {
        opacity: .11; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch' seed='9'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
      }

      /* barras cinematográficas — fechadas na abertura e no fim, abertas no reel */
      .barra-cine { position: absolute; left: 0; width: 1920px; height: 139px;
        background: var(--preto); transform-origin: center; }
      #barra-topo { top: 0; transform-origin: top center; }
      #barra-base { bottom: 0; transform-origin: bottom center; }

      .corte { background: #ffffff; }

      /* ---------- abertura ---------- */
      #abertura { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 0 140px; text-align: center; }
      #ab-conteudo { display: flex; flex-direction: column; align-items: center; width: 100%; }
      #ab-kicker { font-size: 27px; font-weight: 700; letter-spacing: .5em; color: var(--acento);
        text-transform: uppercase; padding-left: .5em; margin-bottom: 36px; }
      .nome-mask { overflow: hidden; display: block; padding: 30px 0; margin: -30px 0; }
      .nome { font-size: 168px; font-weight: 900; line-height: .92; letter-spacing: -.05em;
        color: var(--ink); text-transform: uppercase; white-space: nowrap;
        text-shadow: 0 30px 90px rgba(0,0,0,.82); }
      #ab-rule { width: 0; height: 4px; margin: 44px auto 32px; background: var(--acento); }
      #ab-sub { font-size: 30px; font-weight: 600; letter-spacing: .38em; color: var(--muted);
        text-transform: uppercase; padding-left: .38em; }

      /* ---------- legenda de plano ---------- */
      .legenda { position: absolute; left: 140px; bottom: 208px; display: flex;
        align-items: flex-end; gap: 30px; }
      .leg-num { font-size: 148px; font-weight: 900; line-height: .78; letter-spacing: -.06em;
        color: var(--acento); text-shadow: 0 20px 60px rgba(0,0,0,.72); }
      .leg-txt { position: relative; display: flex; flex-direction: column; padding-bottom: 14px; }
      .leg-tit { display: block; font-size: 52px; font-weight: 800; color: var(--ink);
        letter-spacing: -.02em; text-shadow: 0 14px 44px rgba(0,0,0,.82); }
      .leg-sub { display: block; font-size: 26px; font-weight: 600; letter-spacing: .24em;
        color: var(--muted); text-transform: uppercase; margin-top: 12px; }
      .leg-risco { position: absolute; left: 0; bottom: -28px; width: 100%; height: 3px;
        background: linear-gradient(90deg, var(--acento), rgba(242,193,78,0));
        transform-origin: left center; }

      /* ---------- grelha final ---------- */
      #grelha { position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; gap: 26px; padding: 0 140px; }
      .mini { width: 388px; height: 218px; object-fit: cover; border-radius: 16px;
        box-shadow: 0 26px 70px rgba(0,0,0,.62); }

      /* ---------- cartão final ---------- */
      #fim { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 0 140px; text-align: center; }
      #fim-nome { font-size: 124px; font-weight: 900; letter-spacing: -.05em; color: var(--ink);
        text-transform: uppercase; line-height: .94; }
      #fim-rule { width: 0; height: 4px; margin: 38px auto 30px; background: var(--acento); }
      #fim-papel { font-size: 29px; font-weight: 600; letter-spacing: .38em; color: var(--muted);
        text-transform: uppercase; padding-left: .38em; }
      #fim-contacto { margin-top: 52px; font-size: 46px; font-weight: 800; color: var(--acento); }
      #fim-nota { margin-top: 16px; font-size: 25px; font-weight: 500; letter-spacing: .22em;
        color: var(--muted); text-transform: uppercase; }

      /* ---------- progresso ---------- */
      #prog-fundo { position: absolute; left: 140px; right: 140px; bottom: 96px; height: 3px;
        background: rgba(255,255,255,.20); border-radius: 3px; overflow: hidden; }
      #prog { width: 100%; height: 100%; transform-origin: left center; background: var(--acento); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1920"
      data-height="1080"
    >
      <!-- ================= PLANOS =================
           Substitua os quatro ficheiros em assets/clipes/ pelos seus.
           data-media-start define em que segundo do clipe original o corte começa. -->
      <video id="p1" class="clip plano" muted src="assets/clipes/clipe-01.mp4"
             data-start="0"    data-duration="7.4" data-media-start="0" data-track-index="0"></video>
      <video id="p2" class="clip plano" muted src="assets/clipes/clipe-02.mp4"
             data-start="7.2"  data-duration="5.0" data-media-start="0" data-track-index="1"></video>
      <video id="p3" class="clip plano" muted src="assets/clipes/clipe-03.mp4"
             data-start="12.0" data-duration="5.0" data-media-start="0" data-track-index="2"></video>
      <video id="p4" class="clip plano" muted src="assets/clipes/clipe-04.mp4"
             data-start="16.8" data-duration="5.2" data-media-start="0" data-track-index="3"></video>

      <div id="veu"     class="clip layer" data-start="0" data-duration="28" data-track-index="4"></div>
      <div id="vinheta" class="clip layer" data-start="0" data-duration="28" data-track-index="5"></div>
      <div id="grao"    class="clip layer" data-start="0" data-duration="28" data-track-index="6"></div>

      <div id="barra-topo" class="barra-cine clip" data-start="0" data-duration="28" data-track-index="7"></div>
      <div id="barra-base" class="barra-cine clip" data-start="0" data-duration="28" data-track-index="8"></div>

      <!-- ================= ABERTURA ================= -->
      <div id="abertura" class="clip" data-start="0" data-duration="7.4" data-track-index="9">
        <div id="ab-conteudo">
          <div id="ab-kicker">Reel aéreo · 2026</div>
          <span class="nome-mask"><span class="nome nm">Lucas</span></span>
          <span class="nome-mask"><span class="nome nm">Bastos</span></span>
          <div id="ab-rule"></div>
          <div id="ab-sub">Imagem aérea · Drone</div>
        </div>
      </div>

      <!-- ================= LEGENDAS ================= -->
      <div id="leg-1" class="legenda clip lg" data-start="7.4" data-duration="4.6" data-track-index="10">
        <span class="leg-num">01</span>
        <span class="leg-txt">
          <span class="leg-tit">Título do plano</span>
          <span class="leg-sub">Local · Data</span>
          <span class="leg-risco"></span>
        </span>
      </div>
      <div id="leg-2" class="legenda clip lg" data-start="12.2" data-duration="4.6" data-track-index="11">
        <span class="leg-num">02</span>
        <span class="leg-txt">
          <span class="leg-tit">Título do plano</span>
          <span class="leg-sub">Local · Data</span>
          <span class="leg-risco"></span>
        </span>
      </div>
      <div id="leg-3" class="legenda clip lg" data-start="17.0" data-duration="4.6" data-track-index="12">
        <span class="leg-num">03</span>
        <span class="leg-txt">
          <span class="leg-tit">Título do plano</span>
          <span class="leg-sub">Local · Data</span>
          <span class="leg-risco"></span>
        </span>
      </div>

      <!-- ================= GRELHA FINAL ================= -->
      <div id="grelha" class="clip" data-start="21.8" data-duration="2.6" data-track-index="13">
        <img class="mini mn" src="assets/clipes/mini-01.jpg" alt="" />
        <img class="mini mn" src="assets/clipes/mini-02.jpg" alt="" />
        <img class="mini mn" src="assets/clipes/mini-03.jpg" alt="" />
        <img class="mini mn" src="assets/clipes/mini-04.jpg" alt="" />
      </div>

      <!-- ================= CARTÃO FINAL ================= -->
      <div id="fim" class="clip" data-start="24.0" data-duration="4.0" data-track-index="14">
        <div id="fim-conteudo">
          <div id="fim-nome">Lucas Bastos</div>
          <div id="fim-rule"></div>
          <div id="fim-papel">Imagem aérea · Drone</div>
          <div id="fim-contacto">@o_seu_instagram</div>
          <div id="fim-nota">Disponível para projetos</div>
        </div>
      </div>

      <!-- cortes brancos -->
      <div id="c1" class="corte clip layer" data-start="7.1"  data-duration="0.5" data-track-index="15"></div>
      <div id="c2" class="corte clip layer" data-start="11.9" data-duration="0.5" data-track-index="16"></div>
      <div id="c3" class="corte clip layer" data-start="16.7" data-duration="0.5" data-track-index="17"></div>
      <div id="c4" class="corte clip layer" data-start="21.6" data-duration="0.5" data-track-index="18"></div>
      <div id="c5" class="corte clip layer" data-start="23.8" data-duration="0.5" data-track-index="19"></div>

      <div id="prog-fundo" class="clip" data-start="0" data-duration="28" data-track-index="20">
        <div id="prog"></div>
      </div>

      <audio id="bgm" class="clip" src="assets/musica-reel.m4a"
        data-start="0" data-duration="28" data-track-index="21" data-volume="0.9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set("#prog", { scaleX: 0 }, 0)
        .to("#prog", { scaleX: 1, duration: 28, ease: "none" }, 0);

      /* barras: fechadas na abertura, abrem no reel, fecham no fim */
      tl.set(["#barra-topo", "#barra-base"], { scaleY: 1 }, 0)
        .to(["#barra-topo", "#barra-base"], { scaleY: 0, duration: 1.1, ease: "power3.inOut" }, 6.6)
        .to(["#barra-topo", "#barra-base"], { scaleY: 1, duration: 1.0, ease: "power3.inOut" }, 23.4);

      /* cada plano com o seu movimento */
      tl.set("#p1", { scale: 1.14 }, 0)
        .to("#p1", { scale: 1.02, duration: 7.4, ease: "none" }, 0)
        .set("#p2", { scale: 1.04, x: 46 }, 0)
        .to("#p2", { scale: 1.13, x: -34, duration: 5.0, ease: "none" }, 7.2)
        .set("#p3", { scale: 1.14, y: -26 }, 0)
        .to("#p3", { scale: 1.03, y: 22, duration: 5.0, ease: "none" }, 12.0)
        .set("#p4", { scale: 1.03, x: -42 }, 0)
        .to("#p4", { scale: 1.14, x: 36, duration: 5.2, ease: "none" }, 16.8);

      /* cortes brancos */
      [["#c1", 7.1], ["#c2", 11.9], ["#c3", 16.7], ["#c4", 21.6], ["#c5", 23.8]]
        .forEach(([sel, t0]) => {
          tl.set(sel, { opacity: 0 }, 0)
            .to(sel, { opacity: 0.92, duration: 0.09, ease: "power2.out" }, t0)
            .to(sel, { opacity: 0, duration: 0.34, ease: "power2.in" }, t0 + 0.11);
        });

      /* abertura */
      tl.set("#ab-kicker", { opacity: 0, y: -18 }, 0)
        .set(".nm",        { y: 190, opacity: 0 }, 0)
        .set("#ab-rule",   { width: 0 }, 0)
        .set("#ab-sub",    { opacity: 0, y: 20 }, 0)
        .to("#ab-kicker", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5)
        .to(".nm", { y: 0, opacity: 1, duration: 1.15, stagger: 0.14, ease: "power4.out" }, 0.8)
        .to("#ab-rule", { width: 400, duration: 0.9, ease: "power2.out" }, 1.9)
        .to("#ab-sub",  { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" }, 2.15)
        .to("#ab-conteudo", { opacity: 0, duration: 0.4, ease: "power2.in" }, 6.7)
        .set("#ab-conteudo", { opacity: 0 }, 7.1);

      /* legendas */
      gsap.utils.toArray(".lg").forEach((el, i) => {
        const t0 = [7.4, 12.2, 17.0][i];
        tl.set(el, { opacity: 0, x: -50 }, 0)
          .set(el.querySelector(".leg-risco"), { scaleX: 0 }, 0)
          .to(el, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, t0 + 0.25)
          .to(el.querySelector(".leg-risco"), { scaleX: 1, duration: 0.7, ease: "power2.out" }, t0 + 0.5)
          .to(el, { opacity: 0, duration: 0.35, ease: "power2.in" }, t0 + 4.0);
      });

      /* grelha final */
      tl.set(".mn", { opacity: 0, scale: 0.86, y: 44 }, 0)
        .to(".mn", { opacity: 1, scale: 1, y: 0, duration: 0.6, stagger: 0.1, ease: "back.out(1.8)" }, 21.85)
        .to("#grelha", { opacity: 0, duration: 0.3, ease: "power2.in" }, 24.05);

      /* cartão final */
      tl.set("#fim-nome",     { opacity: 0, y: 36, scale: 1.04 }, 0)
        .set("#fim-rule",     { width: 0 }, 0)
        .set("#fim-papel",    { opacity: 0, y: 18 }, 0)
        .set("#fim-contacto", { opacity: 0, y: 24 }, 0)
        .set("#fim-nota",     { opacity: 0, y: 16 }, 0)
        .to("#fim-nome",     { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: "power3.out" }, 24.15)
        .to("#fim-rule",     { width: 340, duration: 0.8, ease: "power2.out" }, 24.7)
        .to("#fim-papel",    { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 24.9)
        .to("#fim-contacto", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 25.25)
        .to("#fim-nota",     { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 25.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
